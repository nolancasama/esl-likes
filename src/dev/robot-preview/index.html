<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Robot preview</title>
<style>
  body { margin: 0; padding: 16px; background: #e9e4da; font: 13px/1.4 system-ui, sans-serif; color: #2a2f36; }
  h2 { margin: 18px 0 6px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; opacity: .65; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { margin-top: 4px; font-size: 11px; opacity: .6; }
  canvas { background: #f7f4ee; border: 1px solid #c9c2b4; border-radius: 6px; display: block; }
  .piece canvas { background: repeating-conic-gradient(#ded8cb 0% 25%, #f2eee4 0% 50%) 0 0/14px 14px; }
</style>
</head>
<body>
<h2>Blank, with this round's instructions</h2>
<div class="row" id="blank"></div>
<h2>Finished, with a deliberately clashing set of accents</h2>
<div class="row" id="done"></div>
<h2>Every label word, in place</h2>
<div class="row" id="labels"></div>
<h2>The nine puppet pieces, cut apart</h2>
<div class="row" id="pieces"></div>
<h2>Is the puppet really the child's drawing?</h2>
<ul id="checks"></ul>

<script type="module">
import { drawRobot, drawPiece, pieceTextureBounds } from '/src/minigames/coloring/robotRenderer.js';
import { PALETTE, PALETTE_HEX } from '/src/minigames/coloring/colorState.js';
import { PIECES, PICTURE_SIZE, REGIONS_BY_PIECE } from '/src/minigames/coloring/robotDefinition.js';

const round = { favourite: 'purple', starred: 'chestPanel',
  labelled: [{ regionId: 'antennaLight', color: 'red' }, { regionId: 'eyes', color: 'yellow' }] };

const finished = {
  antennaLight: 'red', antennaStalk: 'green', face: 'orange', ears: 'pink', eyes: 'yellow',
  shoulders: 'blue', body: 'green', chestPanel: 'purple', buttons: 'pink', sidePanels: 'purple',
  leftUpperArm: 'blue', leftForearm: 'orange', rightUpperArm: 'blue', rightForearm: 'orange',
  leftLeg: 'purple', leftFoot: 'red', rightLeg: 'purple', rightFoot: 'red',
};

function page(parent, size, opts, caption) {
  const fig = document.createElement('figure');
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const dctx = c.getContext('2d');
  dctx.fillStyle = '#f7f4ee'; dctx.fillRect(0, 0, size, size);
  drawRobot(dctx, { size, ...opts });
  fig.append(c);
  const cap = document.createElement('figcaption'); cap.textContent = caption;
  fig.append(cap);
  parent.append(fig);
}

page(document.getElementById('blank'), 560, { colors: {}, round }, 'blank + ★ + RED + YELLOW');
page(document.getElementById('blank'), 320, { colors: {}, round }, 'same at 320px');
page(document.getElementById('done'), 560, { colors: finished, round }, 'finished (labels gone)');
page(document.getElementById('done'), 560, { colors: finished, round, highlight: 'leftForearm' },
  'hover highlight on the left forearm');

// Every one of the seven words in both label slots, to prove none overflows.
for (const color of PALETTE) {
  page(document.getElementById('labels'), 240, {
    colors: {}, round: { favourite: 'blue', starred: 'chestPanel',
      labelled: [{ regionId: 'antennaLight', color }, { regionId: 'eyes', color }] },
  }, color.toUpperCase());
}

const pieces = document.getElementById('pieces');
for (const piece of PIECES) {
  const box = pieceTextureBounds(piece, { size: PICTURE_SIZE });
  const fig = document.createElement('figure');
  fig.className = 'piece';
  const c = document.createElement('canvas');
  c.width = Math.ceil(box.width); c.height = Math.ceil(box.height);
  drawPiece(c.getContext('2d'), piece, { size: PICTURE_SIZE, colors: finished });
  fig.append(c);
  const cap = document.createElement('figcaption');
  cap.textContent = `${piece} ${c.width}x${c.height}`;
  fig.append(cap);
  pieces.append(fig);
}
// --- proof, not argument -------------------------------------------------
// The plan asked for each puppet piece to be *cropped out of* the finished
// canvas. This renders each piece from the shared definitions instead, which
// is only acceptable if the result is the same image. So check it here, on
// real pixels, rather than reasoning about it.
const checks = [];
const say = (name, ok, detail = '') => {
  checks.push({ name, ok, detail });
  const li = document.createElement('li');
  li.textContent = `${ok ? 'PASS' : 'FAIL'} — ${name}${detail ? ` (${detail})` : ''}`;
  li.style.color = ok ? '#2c6e3f' : '#a3231f';
  li.style.fontWeight = '700';
  document.getElementById('checks').append(li);
};

const S = PICTURE_SIZE;
function surfaceOf(draw, transparent) {
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');
  if (!transparent) { g.fillStyle = '#f7f4ee'; g.fillRect(0, 0, S, S); }
  draw(g);
  return g.getImageData(0, 0, S, S).data;
}

// The finished page, exactly as snapshot() produces it for the wall frame.
const pageData = surfaceOf((g) => drawRobot(g, { size: S, colors: finished, labels: false }), false);

// Each piece, drawn into full-picture coordinates so the two are comparable.
const pieceLayers = PIECES.map((piece) => ({
  piece,
  data: surfaceOf((g) => drawRobot(g, {
    size: S, colors: finished, only: REGIONS_BY_PIECE[piece], labels: false,
  }), true),
}));

// Sampled on a 3px lattice: ~17k samples, enough to prove an identity and fast
// enough to run on every page load.
//
// Compared in two groups, because the honest claim is not "every pixel is the
// same". Where a piece meets a neighbour, the page has the neighbour's black
// outline antialiased over the seam and the lone piece does not — the pieces
// are coming apart, so a neighbour's ink must NOT be baked into this piece.
// The claim that matters is about the interior: a pixel safely inside one
// piece is the same colour in the piece as it is on the page.
const STRIDE = 3;
const alphaAt = (data, x, y) => data[((y * S + x) * 4) + 3];

let interior = 0;
let interiorBad = 0;
let edge = 0;
let edgeBad = 0;
let covered = 0;
for (let y = STRIDE; y < S - STRIDE; y += STRIDE) {
  for (let x = STRIDE; x < S - STRIDE; x += STRIDE) {
    const i = (y * S + x) * 4;
    let owner = null;
    let owners = 0;
    for (const layer of pieceLayers) {
      if (layer.data[i + 3] > 200) { owners += 1; owner = layer; }
    }
    if (owners) covered += 1;
    if (owners !== 1) continue;

    // Interior means: fully opaque in its own piece across its whole
    // neighbourhood, AND completely untouched by every other piece there --
    // alpha exactly 0, not merely under the ownership threshold. A neighbour's
    // antialiased outline with alpha 150 owns nothing but still tints the page,
    // and counting those as interior is what made this check look like a
    // genuine mismatch when it is a seam.
    const around = [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]];
    const solid = around.every(([dx, dy]) => alphaAt(owner.data, x + dx, y + dy) === 255)
      && pieceLayers.every((layer) => layer === owner
        || around.every(([dx, dy]) => alphaAt(layer.data, x + dx, y + dy) === 0));
    const bad = Math.abs(owner.data[i] - pageData[i]) > 2
      || Math.abs(owner.data[i + 1] - pageData[i + 1]) > 2
      || Math.abs(owner.data[i + 2] - pageData[i + 2]) > 2;
    if (solid) { interior += 1; if (bad) interiorBad += 1; }
    else { edge += 1; if (bad) edgeBad += 1; }
  }
}
say('inside a piece, every pixel is the colour it is on the page',
  interiorBad === 0, `${interior.toLocaleString()} interior samples, ${interiorBad} differ`);
say('differences are confined to the seams, where a neighbour outline used to bleed',
  edgeBad / Math.max(1, edge) < 0.5 && edge / Math.max(1, interior) < 0.25,
  `${edgeBad} of ${edge.toLocaleString()} seam samples differ`);
say('the pieces together cover the whole drawing',
  covered >= interior + edge, `${covered.toLocaleString()} covered`);

// No colour the child chose may go missing when the robot is cut up. One pass
// per surface, bucketing by quantised colour, rather than a scan per colour.
const key = (r, g, b) => `${r >> 3},${g >> 3},${b >> 3}`;
const PALETTE_KEYS = new Map(Object.entries(PALETTE_HEX).map(([name, hex]) => [
  key(parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)),
  name,
]));
function paletteHits(data) {
  const seen = new Set();
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 200) continue;
    const name = PALETTE_KEYS.get(key(data[i], data[i + 1], data[i + 2]));
    if (name) seen.add(name);
  }
  return seen;
}
const onPage = paletteHits(pageData);
const onPieces = new Set();
for (const layer of pieceLayers) for (const c of paletteHits(layer.data)) onPieces.add(c);
const missing = [...onPage].filter((c) => !onPieces.has(c));
say('every colour on the page survives into the pieces', missing.length === 0,
  missing.length ? `missing ${missing.join(', ')}` : `${onPage.size} of ${PALETTE.length} colours present`);

// A piece must never carry a neighbour's region.
let trespass = null;
for (const layer of pieceLayers) {
  const mine = new Set(REGIONS_BY_PIECE[layer.piece]);
  for (const other of PIECES) {
    if (other === layer.piece) continue;
    for (const id of REGIONS_BY_PIECE[other]) if (mine.has(id)) trespass = `${layer.piece}/${id}`;
  }
}
say('no region belongs to two pieces', !trespass, trespass ?? 'ownership is exclusive');

window.__checks = checks;
window.__ready = true;
</script>
</body>
</html>
