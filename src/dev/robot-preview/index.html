<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Robot preview</title>
<style>
  body { margin: 0; padding: 16px; background: #e9e4da; font: 13px/1.4 system-ui, sans-serif; color: #2a2f36; }
  h2 { margin: 18px 0 6px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; opacity: .65; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { margin-top: 4px; font-size: 11px; opacity: .6; }
  canvas { background: #f7f4ee; border: 1px solid #c9c2b4; border-radius: 6px; display: block; }
  .piece canvas { background: repeating-conic-gradient(#ded8cb 0% 25%, #f2eee4 0% 50%) 0 0/14px 14px; }
  ul { margin: 4px 0 0; padding-left: 1.1rem; }
  li { font-weight: 700; }
</style>
</head>
<body>
<h2>The blank page — a colouring book, not a worksheet</h2>
<div class="row" id="blank"></div>
<h2>Painted freehand, messily, with a spill over the lines</h2>
<div class="row" id="painted"></div>
<h2>Brush sizes, to scale</h2>
<div class="row" id="brushes"></div>
<h2>The five puppet pieces, cut out of the paint</h2>
<div class="row" id="pieces"></div>
<h2>Checks</h2>
<ul id="checks"></ul>

<script type="module">
import {
  drawPage, drawPiece, drawLineArt, drawBlankBody, pieceTextureBounds, PAPER,
} from '/src/minigames/coloring/robotRenderer.js';
import {
  PICTURE_SIZE, PIECES, SHAPES, SHAPES_BY_PIECE, insideSilhouette, silhouetteArea,
} from '/src/minigames/coloring/robotDefinition.js';
import { BRUSHES, DEFAULT_BRUSH } from '/src/minigames/coloring/brushes.js';
import { PALETTE_HEX } from '/src/minigames/coloring/palette.js';
import { createCoverage, POWER_THRESHOLD } from '/src/minigames/coloring/coverage.js';

const S = PICTURE_SIZE;
const checks = [];
const say = (name, ok, detail = '') => {
  checks.push({ name, ok, detail });
  const li = document.createElement('li');
  li.textContent = `${ok ? 'PASS' : 'FAIL'} — ${name}${detail ? ` (${detail})` : ''}`;
  li.style.color = ok ? '#2c6e3f' : '#a3231f';
  document.getElementById('checks').append(li);
};

function shot(parent, caption, draw, size = 520, cls = '') {
  const fig = document.createElement('figure');
  if (cls) fig.className = cls;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  draw(c.getContext('2d'), size);
  fig.append(c);
  const cap = document.createElement('figcaption');
  cap.textContent = caption;
  fig.append(cap);
  parent.append(fig);
}

// --- a simulated freehand painting ---------------------------------------
const paint = document.createElement('canvas');
paint.width = S; paint.height = S;
const pctx = paint.getContext('2d');
const coverage = createCoverage();

function stroke(color, diameter, points) {
  pctx.strokeStyle = PALETTE_HEX[color];
  pctx.fillStyle = PALETTE_HEX[color];
  pctx.lineWidth = diameter;
  pctx.lineCap = 'round';
  pctx.lineJoin = 'round';
  pctx.beginPath();
  pctx.moveTo(points[0][0] * S, points[0][1] * S);
  for (const [x, y] of points.slice(1)) pctx.lineTo(x * S, y * S);
  pctx.stroke();
  for (let i = 1; i < points.length; i += 1) {
    coverage.paintSegment(points[i - 1], points[i], diameter / S, color);
  }
}

// head, torso, one arm scribbled, legs, plus a deliberate spill off the left arm
stroke('blue', BRUSHES.large.diameter, [[0.33, 0.2], [0.67, 0.2], [0.33, 0.27], [0.67, 0.27], [0.36, 0.32]]);
stroke('pink', BRUSHES.large.diameter, [[0.33, 0.44], [0.67, 0.44], [0.33, 0.52], [0.67, 0.52], [0.33, 0.6], [0.6, 0.6]]);
stroke('green', BRUSHES.medium.diameter, [[0.2, 0.46], [0.24, 0.55], [0.18, 0.62], [0.06, 0.66]]);
stroke('orange', BRUSHES.medium.diameter, [[0.79, 0.46], [0.79, 0.66]]);
stroke('purple', BRUSHES.medium.diameter, [[0.4, 0.78], [0.4, 0.88]]);
stroke('yellow', BRUSHES.small.diameter, [[0.6, 0.78], [0.6, 0.88], [0.56, 0.92], [0.65, 0.92]]);
stroke('red', BRUSHES.small.diameter, [[0.5, 0.1], [0.5, 0.06]]);

shot(document.getElementById('blank'), 'blank, no instructions anywhere',
  (ctx, size) => drawPage(ctx, { size }));
shot(document.getElementById('blank'), 'same at 300px',
  (ctx, size) => drawPage(ctx, { size }), 300);
shot(document.getElementById('blank'), 'mid-blink',
  (ctx, size) => drawPage(ctx, { size, blink: 1 }), 300);

shot(document.getElementById('painted'), 'freehand paint under the line art',
  (ctx, size) => drawPage(ctx, { size, paint }));
shot(document.getElementById('painted'), 'the paint alone — note the spill past the left arm',
  (ctx, size) => {
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, size, size);
    ctx.drawImage(paint, 0, 0, size, size);
  });

for (const [name, brush] of Object.entries(BRUSHES)) {
  shot(document.getElementById('brushes'), `${name} — ${brush.diameter}px${name === DEFAULT_BRUSH ? ' (default)' : ''}`,
    (ctx, size) => {
      ctx.fillStyle = PAPER; ctx.fillRect(0, 0, size, size);
      drawBlankBody(ctx, { size });
      ctx.strokeStyle = PALETTE_HEX.purple;
      ctx.lineWidth = brush.diameter * (size / S);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0.33 * size, 0.5 * size);
      ctx.lineTo(0.67 * size, 0.5 * size);
      ctx.stroke();
      drawLineArt(ctx, { size });
    }, 220);
}

const pieces = document.getElementById('pieces');
for (const piece of PIECES) {
  const box = pieceTextureBounds(piece, { size: S });
  const fig = document.createElement('figure');
  fig.className = 'piece';
  const c = document.createElement('canvas');
  c.width = Math.ceil(box.width); c.height = Math.ceil(box.height);
  drawPiece(c.getContext('2d'), piece, { size: S, paint });
  fig.append(c);
  const cap = document.createElement('figcaption');
  cap.textContent = `${piece} ${c.width}x${c.height}`;
  fig.append(cap);
  pieces.append(fig);
}

// --- checks ---------------------------------------------------------------
say('the robot fills a useful share of the page', silhouetteArea(200) > 0.3,
  `${(silhouetteArea(200) * 100).toFixed(1)}% of the canvas`);
say('five pieces, and every shape belongs to one of them',
  PIECES.length === 5 && SHAPES.every((s) => PIECES.includes(s.piece)),
  `${SHAPES.length} shapes`);

// Every limb must overlap the body, or the puppet shows seams at rest.
const overlaps = ['leftArm', 'rightArm', 'leftLeg', 'rightLeg'].map((piece) => {
  const ids = SHAPES_BY_PIECE[piece].map((e) => e.id);
  let touching = 0;
  for (let i = 0; i < 4000; i += 1) {
    const s = SHAPES.find((e) => ids.includes(e.id));
    const b = s.shape;
    const x = b.x + Math.random() * b.width;
    const y = b.y + Math.random() * b.height;
    const bodyIds = SHAPES_BY_PIECE.body.map((e) => e.id);
    if (SHAPES.some((e) => bodyIds.includes(e.id)
      && (e.shape.kind === 'rect'
        ? x >= e.shape.x && x <= e.shape.x + e.shape.width && y >= e.shape.y && y <= e.shape.y + e.shape.height
        : false))) touching += 1;
  }
  return { piece, touching };
});
say('every limb overlaps the body, so no seam shows at rest',
  overlaps.every((o) => o.touching > 0),
  overlaps.map((o) => `${o.piece}:${o.touching}`).join(' '));

// The coverage model: what the simulated painting scored.
say('painting charges the bar', coverage.power() > 0.05,
  `power ${(coverage.power() * 100).toFixed(1)}% of a ${(POWER_THRESHOLD * 100).toFixed(0)}% threshold`);
const before = coverage.power();
stroke('pink', BRUSHES.large.diameter, [[0.33, 0.44], [0.67, 0.44], [0.33, 0.52], [0.67, 0.52]]);
say('repainting the same place charges nothing more',
  Math.abs(coverage.power() - before) < 1e-9, `${before.toFixed(4)} -> ${coverage.power().toFixed(4)}`);
const beforeBg = coverage.power();
stroke('blue', BRUSHES.large.diameter, [[0.03, 0.05], [0.25, 0.05], [0.03, 0.12]]);
say('painting the paper around the robot charges nothing',
  Math.abs(coverage.power() - beforeBg) < 1e-9, `${beforeBg.toFixed(4)} -> ${coverage.power().toFixed(4)}`);
say('only silhouette cells can ever count',
  !insideSilhouette(0.03, 0.05) && insideSilhouette(0.5, 0.5));

window.__checks = checks;
window.__ready = true;
</script>
</body>
</html>
