<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Paper puppet preview</title>
<style>
  body { margin: 0; padding: 14px; background: #e9e4da; font: 13px/1.4 system-ui, sans-serif; color: #2a2f36; }
  h2 { margin: 16px 0 6px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; opacity: .6; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { margin-top: 3px; font-size: 10px; opacity: .6; text-align: center; }
  canvas { display: block; border: 1px solid #c9c2b4; border-radius: 4px; background: #f3efe6; }
</style>
</head>
<body>
<h2>At rest — the seam test: does this read as ONE paper robot?</h2>
<div class="row" id="rest"></div>
<h2>One hop, twelve frames (front)</h2>
<div class="row" id="hop"></div>
<h2>Idle, startup, celebrate</h2>
<div class="row" id="states"></div>
<h2>Three-quarter and near-edge views — it has to read as paper</h2>
<div class="row" id="angles"></div>

<script type="module">
import * as THREE from 'three';
import { createPaperPuppet } from '/src/minigames/coloring/paperPuppet.js';
import { DURATIONS, PUPPET_HEIGHT, STATES, poseFor } from '/src/minigames/coloring/robotPuppet.js';
import { PICTURE_SIZE } from '/src/minigames/coloring/robotDefinition.js';
import { PALETTE_HEX } from '/src/minigames/coloring/palette.js';
import { BRUSHES } from '/src/minigames/coloring/brushes.js';

// A stand-in for a child's freehand painting: a few messy strokes per area, in
// different colours, so a seam between two pieces would show as a colour break.
const paint = document.createElement('canvas');
paint.width = PICTURE_SIZE; paint.height = PICTURE_SIZE;
{
  const g = paint.getContext('2d');
  const stroke = (color, brush, points) => {
    g.strokeStyle = PALETTE_HEX[color];
    g.lineWidth = BRUSHES[brush].diameter;
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(points[0][0] * PICTURE_SIZE, points[0][1] * PICTURE_SIZE);
    for (const [x, y] of points.slice(1)) g.lineTo(x * PICTURE_SIZE, y * PICTURE_SIZE);
    g.stroke();
  };
  stroke('blue', 'large', [[0.32, 0.2], [0.68, 0.2], [0.32, 0.28], [0.68, 0.28], [0.4, 0.33]]);
  stroke('pink', 'large', [[0.32, 0.43], [0.68, 0.43], [0.32, 0.52], [0.68, 0.52], [0.32, 0.62], [0.68, 0.62], [0.4, 0.72]]);
  stroke('green', 'medium', [[0.2, 0.45], [0.2, 0.68]]);
  stroke('orange', 'medium', [[0.79, 0.45], [0.79, 0.68]]);
  stroke('purple', 'medium', [[0.4, 0.77], [0.4, 0.93]]);
  stroke('yellow', 'medium', [[0.6, 0.77], [0.6, 0.93]]);
  stroke('red', 'small', [[0.5, 0.05], [0.5, 0.14]]);
}

const W = 210, H = 270;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(W, H, false);
renderer.setClearColor(0xf3efe6);

const scene = new THREE.Scene();
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 12),
  new THREE.MeshBasicMaterial({ color: 0xe6dfd0 }),
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const puppet = createPaperPuppet({ paint, textureSize: 900 });
scene.add(puppet.group);

function shot(parent, caption, { state, t, yaw = 0, elev = 0.9, dist = 4.6 }) {
  puppet.stopRoaming().setState(state);
  puppet.group.rotation.y = yaw;
  // setPose goes through the puppet's own apply path, so the glow, the eyelid
  // and the shadow all match the frame rather than an accumulated clock.
  puppet.setPose(poseFor(state, t));

  const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 40);
  camera.position.set(0, elev + 0.5, dist);
  camera.lookAt(0, PUPPET_HEIGHT * 0.62, 0);
  renderer.render(scene, camera);

  const fig = document.createElement('figure');
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  out.getContext('2d').drawImage(renderer.domElement, 0, 0);
  fig.append(out);
  const cap = document.createElement('figcaption');
  cap.textContent = caption;
  fig.append(cap);
  parent.append(fig);
}

const rest = document.getElementById('rest');
for (const [caption, opts] of [
  ['idle, dead centre', { state: STATES.IDLE, t: 0, dist: 4.6 }],
  ['idle, close', { state: STATES.IDLE, t: 0, dist: 3.4, elev: 1.0 }],
  ['idle, shoulders close up', { state: STATES.IDLE, t: 0.65, dist: 2.3, elev: 1.25 }],
  ['idle, slight yaw', { state: STATES.IDLE, t: 1.3, yaw: 0.35, dist: 4.0 }],
]) shot(rest, caption, opts);

const hop = document.getElementById('hop');
for (let i = 0; i < 12; i += 1) {
  const t = (i / 12) * DURATIONS[STATES.HOP];
  shot(hop, `${((i / 12) * 100).toFixed(0)}%`, { state: STATES.HOP, t });
}

const states = document.getElementById('states');
for (const [state, fracs] of [
  [STATES.IDLE, [0, 0.25, 0.5, 0.75]],
  [STATES.STARTUP, [0.1, 0.45, 0.7, 0.95]],
  [STATES.CELEBRATE, [0.15, 0.45, 0.75]],
]) {
  for (const f of fracs) shot(states, `${state} ${(f * 100).toFixed(0)}%`, { state, t: f * DURATIONS[state] });
}

const angles = document.getElementById('angles');
for (const yaw of [0, 0.5, 1.0, 1.35, 1.5, Math.PI]) {
  shot(angles, `yaw ${yaw.toFixed(2)}`, { state: STATES.IDLE, t: 0.4, yaw });
}

window.__ready = true;
</script>
</body>
</html>
